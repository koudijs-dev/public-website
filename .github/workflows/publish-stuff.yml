name: Publish stuff yeahj

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # manual run

permissions:
  contents: write               # gh-pages push
  packages: write               # production image to ghcr.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Build
        run: hugo --minify
        env:
          HUGO_PARAMS_gitsha: ${{ github.sha }}   # version footer (links to the commit)

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      # The same ./public as an image, for serving koudijs.dev from the cluster.
      # Unlike the preview images this keeps the real baseURL, so feeds and
      # canonical links are absolute.
      # Tagged prod-sha-<short> so it never collides with a preview's sha-<short>.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Production image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=prod-sha-

      - name: Build & push production image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Reference to pin
        run: |
          echo "### Production image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
